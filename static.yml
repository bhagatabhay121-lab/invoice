  </table></div>
  <p>Crash and analytics reports are tied to the random install ID. We do not put your phone number, name, customers or amounts in these reports.</p>
</section>

<section id="notcollect">
  <h2>4. Data we do not collect</h2>
  <ul>
    <li>Your contacts, SMS, call logs or call recordings.</li>
    <li>Your location (precise or approximate) through the device. Firebase may infer a rough region from your IP address if you allow analytics.</li>
    <li>Microphone recordings, or camera images except the photo you pick or take for your logo or signature.</li>
    <li>Your advertising ID, or any data for advertising.</li>
    <li>Card, UPI PIN or net-banking details. The app does not take payments. The UPI ID and bank details you enter are printed on your invoices.</li>
    <li>Biometric data, health data, or any precise device-wide tracking.</li>
  </ul>
</section>

<section id="purposes">
  <h2>5. Why we use your data</h2>
  <ul>
    <li><strong>Provide the app (consent):</strong> sign you in, create invoices and reports, back up and restore your data, sync your phone and PC, email invoices at your request, look up GSTINs, make the invite and reward feature work.</li>
    <li><strong>Support and communication:</strong> answer feedback and problems, contact you about your account, send you update, maintenance and service notices, block or pause an account that breaks the terms.</li>
    <li><strong>Improve the app (optional consent):</strong> analytics and crash reports.</li>
    <li><strong>Security and fairness:</strong> protect accounts, find misuse of invite codes, prevent fraud, keep logs of consent and deletion requests.</li>
    <li><strong>Legal duties:</strong> keep or disclose data only where a law, court or authority requires it.</li>
  </ul>
  <p>We use data only for the purposes above. If we want to use it for a new purpose, we will first tell you and, where needed, ask for your consent again. We never sell your data or use it for advertising.</p>
</section>

<section id="consent">
  <h2>6. Notice and consent</h2>
  <ul>
    <li>After you sign in, a separate <em>Your privacy</em> screen shows this notice in simple words. Nothing is uploaded to our cloud until you tap <em>I agree and continue</em>.</li>
    <li>There are two purposes: <strong>required</strong> (account and backup) and <strong>optional</strong> (help improve the app). The optional switch starts <strong>off</strong>. Nothing is pre-selected and agreement is never assumed from installing the app or accepting the Terms.</li>
    <li>If you do not agree to the required part, we cannot run your account or backup. You may go back or delete your data and account.</li>
    <li>We record your choice on your phone and, once you are signed in, in your account: notice version, purposes, time and platform.</li>
    <li><strong>Withdraw or change at any time</strong> in <em>Settings &rarr; Privacy &amp; consent</em>. Withdrawing is as easy as giving. Switching analytics off stops it, turns off Firebase Analytics, Crashlytics and Performance, and deletes the usage records we hold for you. Withdrawing the required consent is done by deleting your data or account (section 12).</li>
    <li>When this notice changes in a way that matters, the app shows it again and asks you to choose again. On a new phone, after reinstalling, or after logging out and in, you are asked again.</li>
    <li>You can read this notice again at any time in Settings.</li>
    <li>The privacy screen and notice are currently shown in English. We are working to add the other languages the app supports. If you need help understanding anything here, write to us and we will explain it.</li>
  </ul>
</section>

<section id="permissions">
  <h2>7. Android permissions</h2>
  <p>Android permissions are not the same as your consent to process data. We ask for a permission only when you use the feature that needs it, and the app works without it where possible.</p>
  <div class="scroll"><table>
    <tr><th>Permission / access</th><th>When it is used</th><th>If you refuse</th></tr>
    <tr><td>Internet / network state</td><td>Sign-in, backup, sync, email, GST lookup, messages</td><td>The app works offline on your phone; cloud features wait</td></tr>
    <tr><td>Camera</td><td>Taking a logo or signature photo; scanning the sign-in QR code shown on your PC</td><td>Choose a photo from the gallery instead, or sign in on the PC another way</td></tr>
    <tr><td>Photos / files (system picker)</td><td>Choosing a logo, signature or a PDF to verify. We use the system picker and see only what you choose</td><td>Feature unavailable</td></tr>
    <tr><td>Phone call (CALL_PHONE)</td><td>The call button next to a customer places the call directly</td><td>The phone dialer opens with the number filled in</td></tr>
    <tr><td>Do Not Disturb access (optional)</td><td>Only if you turn on &ldquo;Do Not Disturb while the app is open&rdquo;; it is off by default</td><td>Feature unavailable</td></tr>
  </table></div>
  <p>We stop using a permission when the feature ends or you revoke it in Android Settings. We do not request contacts, SMS, call logs, microphone or location.</p>
</section>

<section id="sdk">
  <h2>8. Services and companies that handle data for us</h2>
  <p>We use the services below. Each receives only what it needs. We keep a register of them and review it when the app changes.</p>
  <div class="scroll"><table>
    <tr><th>Service</th><th>Used for</th><th>Data</th><th>When it runs</th></tr>
    <tr><td>Google Firebase Authentication</td><td>Phone sign-in and the SMS code</td><td>Mobile number, sign-in token</td><td>At sign-in</td></tr>
    <tr><td>Google Firebase Realtime Database (Google Cloud)</td><td>Backup, sync, consent record, messages, feedback</td><td>Data in section 3</td><td>After you agree to this notice</td></tr>
    <tr><td>Google Firebase Analytics, Crashlytics, Performance Monitoring</td><td>Usage, crashes, speed</td><td>Random install ID, events, crash and device information</td><td>Only after you switch analytics on</td></tr>
    <tr><td>Our email gateway (hosted on Supabase) and Maileroo</td><td>Send the invoice PDF you choose to email</td><td>Recipient email, subject, message, PDF</td><td>Only when you send an email</td></tr>
    <tr><td>GST portal lookup service (Express GST API)</td><td>Look up a GSTIN</td><td>GSTIN and CAPTCHA you type</td><td>Only when you look up a GSTIN</td></tr>
    <tr><td>Google Play (install referrer)</td><td>Read the friend&rsquo;s invite code after install</td><td>Invite code</td><td>First start on Android</td></tr>
    <tr><td>WhatsApp, email apps, share sheet on your phone</td><td>Share invoices or the app link when you tap share</td><td>What you choose to share</td><td>Only when you tap share</td></tr>
  </table></div>
  <p>These providers may have their own privacy terms. We choose providers that protect data and do not sell it. Analytics and advertising partners are not used.</p>
</section>

<section id="share">
  <h2>9. Sharing and disclosure</h2>
  <ul>
    <li>We do <strong>not</strong> sell, rent or trade your data and we do not share it for advertising.</li>
    <li>We share data only with the services in section 8, when you tell the app to share something (for example sending an invoice by email or WhatsApp), or when a law, court order or government authority requires it.</li>
    <li>Only the publisher can open our admin console, which is protected by a login. It is used to give support, send messages, see account and usage information, and delete accounts on request.</li>
    <li>If the app is ever transferred to another owner, your data stays under a policy at least as protective as this one, and we will tell you in the app first.</li>
  </ul>
</section>

<section id="abroad">
  <h2>10. Storage location and transfers outside India</h2>
  <p>Your data is stored on Google Cloud servers through Firebase. Google may process or back up data on servers in India or in other countries. We transfer data outside India only to the service providers in section 8 and only as far as Indian law permits. Data that stays on your phone or PC is stored only on that device.</p>
</section>

<section id="retention">
  <h2>11. How long we keep data</h2>
  <div class="scroll"><table>
    <tr><th>Data</th><th>How long</th></tr>
    <tr><td>Account, business data, consent record</td><td>Until you delete your data or account. They are then deleted from our database. Google may keep backups of its systems for a limited time until they expire on their own schedule.</td></tr>
    <tr><td>Optional usage records</td><td>Until you switch analytics off or delete your account</td></tr>
    <tr><td>Crash, screen and speed reports in Firebase</td><td>For the period set by Google for those services; we stop collecting them when you switch analytics off</td></tr>
    <tr><td>Feedback</td><td>Until you ask us to delete it, or you delete your account (we then remove it using the deletion note below)</td></tr>
    <tr><td>Deletion note (your phone number key, time, and any record we still must remove)</td><td>Only until we have finished removing your remaining records, then it is deleted</td></tr>
    <tr><td>Safety copies on your phone</td><td>Removed automatically after 14 days (90 days for a copy of data that was not backed up)</td></tr>
    <tr><td>Data on your phone or PC</td><td>Until you log out, delete your data, clear app data or uninstall</td></tr>
    <tr><td>Anything a law requires us to keep (for example, records requested by an authority)</td><td>For the period that law requires, and we will tell you the reason if you ask</td></tr>
  </table></div>
  <p>We do not keep personal data for ever. Data we no longer need for its purpose is deleted or made anonymous.</p>
</section>

<section id="deletion">
  <h2>12. Deleting your data</h2>
  <p>Go to <em>Settings &rarr; Delete my data</em> (also in <em>Privacy &amp; consent</em>). You choose:</p>
  <ul>
    <li><strong>Delete only my data:</strong> deletes your profile, customers, products, invoices, khata and stock from our cloud and from your phone. You stay signed in; your name, sign-in account and usage records stay.</li>
    <li><strong>Delete my account too:</strong> also deletes your name, usage records, referral code, consent record and your sign-in account, signs you out and erases everything on your phone.</li>
  </ul>
  <h3>Request deletion without the app</h3>
  <p>If you cannot open the app or have uninstalled it, you can still ask us to delete your account and data for <strong>Invoice Maker (Free Invoice Generator)</strong>. Email <a href="mailto:abhaybhagat170@gmail.com?subject=Delete%20my%20account%20-%20Invoice%20Maker&amp;body=Please%20delete%20my%20account%20and%20all%20my%20data.%20My%20registered%20mobile%20number%20is%3A%20">abhaybhagat170@gmail.com</a> with the subject &ldquo;Delete my account - Invoice Maker&rdquo; and the mobile number you signed in with. We will confirm it is you (for example, by asking you to reply from the email or number on the account), delete your account and all data linked to it as described above, and confirm by email when it is done.</p>
  <p>You type DELETE to confirm. It cannot be undone, so copy your data first if you want a copy. Because users cannot delete their own feedback, the app files a short note and we remove your feedback and any record the app could not delete, then delete the note. Deleting the app alone does not delete your cloud copy. You can also email us from the contact in section 22 and we will do it for you after checking it is you. Deleting your data does not remove copies you have already emailed or shared, or PDFs saved outside the app.</p>
</section>

<section id="rights">
  <h2>13. Your rights</h2>
  <ul>
    <li><strong>Access:</strong> ask for a summary of the personal data we process and who we share it with. You can also copy all your data from <em>Settings &rarr; Privacy &amp; consent &rarr; Copy my data</em>.</li>
    <li><strong>Correction and updating:</strong> edit your profile, customers, products and documents in the app; changes are saved to your backup. For anything you cannot change yourself, write to us.</li>
    <li><strong>Erasure:</strong> delete your data or account as in section 12, subject to any legal retention.</li>
    <li><strong>Withdraw consent:</strong> as in section 6.</li>
    <li><strong>Grievance redressal:</strong> write to us (section 22). We will reply within the time the law sets. If you are not satisfied, you may complain to the Data Protection Board of India after you have used our grievance process.</li>
    <li><strong>Nominate someone:</strong> you may nominate another person to exercise your rights if you die or cannot act for yourself. Tell us by email with the person&rsquo;s details.</li>
  </ul>
  <p>To protect you, we verify that a request comes from the phone number on the account before we show, change or delete anything. We never give your data to someone who cannot prove they are you. We keep a record of each request, how we handled it and when it was completed. You do not have to pay to use these rights.</p>
</section>

<section id="children">
  <h2>14. Children</h2>
  <p>The app is for business use by people aged <strong>18 or older</strong>. It is not made for children and we do not knowingly collect a child&rsquo;s personal data. We do not track or monitor children&rsquo;s behaviour and we do not show targeted ads to anyone. If you believe a child under 18 has used the app, write to us and we will delete the account and data after checking the request.</p>
</section>

<section id="security">
  <h2>15. Security</h2>
  <ul>
    <li>All traffic between the app and our servers uses HTTPS (encrypted in transit).</li>
    <li>Database rules let each signed-in phone number read and write only its own records. Only the publisher&rsquo;s admin account can read across accounts.</li>
    <li>Sign-in uses a one-time SMS code. Sign-in tokens are managed by Google Firebase.</li>
    <li>The admin console is protected by a password login and used only by the publisher.</li>
    <li>Data in Google Cloud is encrypted at rest by Google. We keep passwords, private keys and sending keys for email on our servers and not inside the app, and we keep production data separate from testing.</li>
    <li>When you log out, your data is removed from the phone only after it is safely in the cloud.</li>
    <li>We keep the app and its libraries updated and review what each library sends.</li>
    <li>Please keep your phone locked, do not share the SMS code, and log out on shared devices.</li>
  </ul>
  <p>No system is completely secure, but we take reasonable steps to protect your data and to reduce the harm if something goes wrong.</p>
</section>

<section id="breach">
  <h2>16. Data breach</h2>
  <p>If personal data is lost, accessed or disclosed without authority, we will contain it (for example, remove exposed keys and block access), find out who and what is affected, and fix the cause. We will tell the Data Protection Board of India and affected users, in the way and within the time that the law requires, and we will tell you in the app or by SMS or email what happened, what data was affected, what we have done and what you can do to protect yourself. We keep a record of each incident and what we learned from it.</p>
</section>

<section id="customers">
  <h2>17. Data of your customers</h2>
  <p>When you enter your customers&rsquo; names, phone numbers, addresses or GSTINs, you decide why and how that data is used for your own business, and you are responsible for having a right to use it. We store it for you only to run the app, back it up and restore it, and we do not use it for our own purposes, advertising or analytics. When you delete it, we delete it from our cloud.</p>
</section>

<section id="windows">
  <h2>18. Windows app</h2>
  <p>The Windows app can be used on the PC only, with no account; then your data stays on that computer and nothing is sent to us. If you sign in with your phone number (by QR code or browser), it works like the phone app, and the privacy choices and deletion above apply in the same way. Local data on the PC is erased by <em>Delete my data</em> or by removing the app.</p>
</section>

<section id="tracking">
  <h2>19. Ads, tracking and profiling</h2>
  <ul>
    <li>No advertisements, no ad networks and no advertising ID.</li>
    <li>No profiling or automated decisions that affect your rights.</li>
    <li>We do not use your phone number, email, Android ID or any other identifier to track you across apps or websites. Optional reports use a random install ID.</li>
    <li>We do not put personal data in links, logs, notifications or crash reports.</li>
  </ul>
</section>

<section id="links">
  <h2>20. Links to other services</h2>
  <p>The app can open the GST portal, WhatsApp, your email app, the Play Store and this policy in your browser. Those services have their own privacy rules and we are not responsible for them.</p>
</section>

<section id="changes">
  <h2>21. Changes to this policy</h2>
  <p>We may update this policy when the app, our services or the law change. The version number and date at the top show the latest version. When a change matters, the app shows the new notice and asks you to choose again; the new policy is not applied to optional processing until you agree. Past versions are available on request.</p>
</section>

<section id="contact">
