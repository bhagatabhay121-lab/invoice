<section id="who">
  <h2>1. Who we are</h2>
  <p>The app is published by <strong>Abhay Bhagat</strong> (&ldquo;we&rdquo;, &ldquo;us&rdquo;). We decide why and how your personal data is used in the app, so we are the <em>Data Fiduciary</em> under the Digital Personal Data Protection Act, 2023. Invoice Maker is a GST invoice generator with saved customers, products, quotations, proforma invoices, delivery challans, khata (udhaar) register, stock register, expenses and GST reports, PDF export, cloud backup and sync between your phone and PC.</p>
  <p>Privacy contact and grievance contact: <a href="mailto:abhaybhagat170@gmail.com">abhaybhagat170@gmail.com</a> (see section 22).</p>
</section>

<section id="law">
  <h2>2. Law that applies</h2>
  <p>This policy is written under the Digital Personal Data Protection Act, 2023 and the Digital Personal Data Protection Rules, 2025 of India, and other Indian laws that apply to us. The Act is being brought into force in phases, and its main duties on notice, consent, rights, security and breach are scheduled to apply from 13 May 2027. We follow them now. This policy is not a certificate of legal compliance and may be updated when the law or notified rules change.</p>
</section>

<section id="collect">
  <h2>3. Personal data we collect</h2>
  <div class="scroll"><table>
    <tr><th>Data</th><th>How we get it</th><th>Why</th><th>Required?</th></tr>
    <tr><td>Mobile number (with +91 country code)</td><td>You type it to sign in; we send a one-time code by SMS</td><td>Sign-in. Your cloud data is stored under this number so it comes back on a new phone or on your PC</td><td>Required</td></tr>
    <tr><td>Name</td><td>You enter it after sign-in</td><td>Support and showing who owns the account</td><td>Required</td></tr>
    <tr><td>Business profile: business name, address, GSTIN, PAN, state, phone, email, bank name, account number, IFSC, UPI ID, default terms, logo image, owner signature image, invoice style choices</td><td>You enter or upload it</td><td>Printed on your invoices; backup and restore</td><td>Required to make invoices; you choose what to fill</td></tr>
    <tr><td>Your customers: name, phone, email, address, GSTIN, state, notes</td><td>You enter it</td><td>Create invoices and khata entries; backup</td><td>You choose what to enter</td></tr>
    <tr><td>Products and stock: items, HSN/SAC, rates, quantities, batches, stock movements</td><td>You enter it</td><td>Create invoices; stock register; backup</td><td>You choose what to enter</td></tr>
    <tr><td>Documents: invoices, quotations, proforma invoices, delivery challans, amounts, taxes, payment status, dates, document numbers, notes, warranty text</td><td>You create them</td><td>Make PDFs, reports and GST returns; backup</td><td>Required for the app to work</td></tr>
    <tr><td>Khata (udhaar) register and Accounts (expenses, GST filing ticks)</td><td>You enter it</td><td>Track money owed and paid; backup</td><td>Optional feature</td></tr>
