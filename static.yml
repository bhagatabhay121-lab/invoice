    <tr><td><strong>Optional crash, screen and speed reports (off until you allow it):</strong> crash traces, screens visited, actions such as &ldquo;document saved&rdquo;, timing of screens and network calls (host and first part of the address only), device model, operating system, app version, country and approximate region from IP address, random install ID</td><td>Firebase Crashlytics, Analytics and Performance Monitoring</td><td>Fix crashes and slow screens</td><td>Optional</td></tr>
