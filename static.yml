    <tr><td>Feedback: message, rating, type, the contact you choose to add, name, app version, phone type, language, time</td><td>You send it from Settings</td><td>Reply to you and improve the app</td><td>Only if you send it</td></tr>
    <tr><td>Invite code you use and friends who join with your code</td><td>You or the friend enter it, or the Play Store install referrer</td><td>Give Premium days to both people</td><td>Only if you use the feature</td></tr>
