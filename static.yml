<header>
  <h1>Privacy Policy</h1>
  <div class="meta">Invoice Maker - Billing App (Play Store name: Free Invoice Generator) &middot; Package com.abhay.invoice<br>
  Policy version 1 &middot; Effective 22 November 2026 &middot; Applies to the Android app, the iOS app (if offered) and the Windows app</div>
</header>

<div class="note">
  <strong>In short.</strong> We keep your phone number, your name and the business data you enter so that you can sign in, back your invoices up and get them back on a new phone. We do not sell your data and we do not show ads. Analytics and crash reports are optional and switched off until you allow them. You can switch them off again, copy your data, correct it, or delete your data or your whole account at any time from <em>Settings &rarr; Privacy &amp; consent</em>.
</div>

